{% extends "layout.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card shadow-sm">
      <div class="card-header bg-primary text-white">
        <h5 class="mb-0"><i class="fas fa-user-edit me-2"></i>Edit Profile</h5>
      </div>

      <div class="card-body">
        <form method="POST" action="{{ url_for('main.edit_profile') }}">
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" name="username" value="{{ current_user.username }}" required>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" value="{{ current_user.email }}" required>
          </div>
          <div class="d-flex justify-content-between">
            <a href="{{ url_for('main.profile') }}" class="btn btn-light"><i class="fas fa-arrow-left me-1"></i> Back</a>
            <button type="submit" class="btn btn-success"><i class="fas fa-save me-1"></i> Save Changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
