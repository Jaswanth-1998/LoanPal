<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Loan Collection System - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="login-card p-5">
                    <div class="text-center mb-4">
                        <i class="bi bi-currency-dollar fs-1 text-primary"></i>
                        <h2 class="mt-3 mb-0 text-primary">Daily Loan Collection</h2>
                        <p class="text-muted">Professional Loan Management System</p>
                    </div>
                    
                    <div class="d-grid">
                        <a href="{{ url_for('replit_auth.login') }}" class="btn btn-primary btn-lg">
                            <i class="bi bi-box-arrow-in-right me-2"></i>
                            Login to Access System
                        </a>
                    </div>
                    
                    <div class="mt-4 text-center">
                        <small class="text-muted">
                            Secure authentication powered by advanced security protocols
                        </small>
                    </div>
                    
                    <div class="mt-5">
                        <div class="row text-center">
                            <div class="col-4">
                                <i class="bi bi-people fs-4 text-primary"></i>
                                <p class="small mt-2 mb-0">Customer<br>Management</p>
                            </div>
                            <div class="col-4">
                                <i class="bi bi-calculator fs-4 text-success"></i>
                                <p class="small mt-2 mb-0">Auto<br>Calculations</p>
                            </div>
                            <div class="col-4">
                                <i class="bi bi-graph-up fs-4 text-info"></i>
                                <p class="small mt-2 mb-0">Progress<br>Tracking</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
