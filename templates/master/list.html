{% extends "layout.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="fas fa-cog"></i> Master Data</h2>
    <a href="{{ url_for('main.add_master') }}" class="btn btn-primary">
        <i class="fas fa-plus"></i> Add Master Data
    </a>
</div>

<div class="card">
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Type</th>
                        <th>Value</th>
                        <th>Created Date</th>
                    </tr>
                </thead>
                <tbody>
                    {% for master in master_list %}
                    <tr>
                        <td>{{ master.id }}</td>
                        <td>
                            <span class="badge 
                                {% if master.type == 'area' %}bg-primary
                                {% elif master.type == 'interest_rate' %}bg-success
                                {% else %}bg-info{% endif %}">
                                {{ master.type }}
                            </span>
                        </td>
                        <td>{{ master.value }}</td>
                        <td>{{ master.created_at.strftime('%d-%m-%Y') }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
