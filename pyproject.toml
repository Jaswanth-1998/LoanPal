[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-loan-collection-system"
version = "1.0.0"
description = "A daily loan collection management system"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
dependencies = [
    "Flask==2.3.3",
    "Flask-SQLAlchemy==3.0.5",
    "Flask-Login==0.6.3",
    "Flask-WTF==1.1.1",
    "WTForms==3.0.1",
    "psycopg2-binary==2.9.7",
    "python-dotenv==1.0.0",
    "Werkzeug==2.3.7"
]

[project.scripts]
daily-loans = "main:app"